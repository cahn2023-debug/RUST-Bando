<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4B4B"/>
      <stop offset="1" stop-color="#A70000"/>
    </linearGradient>
    <!-- Simple shadow for the letter P -->
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="20" dy="20" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#paint0_linear)"/>
  <text x="512" y="700" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="700" font-style="italic" text-anchor="middle" style="filter:url(#shadow)">P</text>
  <rect x="40" y="40" width="944" height="944" rx="160" stroke="white" stroke-width="20" stroke-opacity="0.1"/>
</svg>
