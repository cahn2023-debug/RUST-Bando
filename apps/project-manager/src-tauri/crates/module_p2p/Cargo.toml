[package]
name = "module_p2p"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.53", features = [
    "tcp",
    "dns",
    "websocket",
    "noise",
    "yamux",
    "mdns",
    "gossipsub",
    "macros",
    "tokio",
    "request-response",
    "serde",
    "identify"
] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
uuid = { version = "1.10", features = ["v4"] }
app_domain = { path = "../app_domain" }
