[package]
name = "gis_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
geo = { version = "0.29", features = ["use-serde"] }
geozero = { version = "0.13", features = ["with-mvt", "with-wkb", "with-wkt", "with-geojson"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
thiserror = "1.0"
shared_kernel = { path = "../shared_kernel" }
