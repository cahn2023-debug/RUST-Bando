[workspace]
members = [
  ".",
  "design_renderer",
  "shared_models", "streetview_wasm",
  "crates/app_domain",
  "crates/module_storage",
  "crates/module_gis",
]

[package]
name = "project-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "project-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "project-manager"
path = "src/main.rs"

[[bin]]
name = "download_models"
path = "src/bin/download_models.rs"
required-features = ["ai"]

[[bin]]
name = "restore_v3_data"
path = "src/bin/restore_v3_data.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "design_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "uuid", "chrono", "macros" ] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
geozero = { version = "0.13", features = ["with-mvt", "with-wkb"] }
rocksdb = "0.22.0"


duckdb = { version = "1.1.1", features = ["bundled"], optional = true }
tokio = "1.49.0"
walkdir = "2.4.0"
notify = "6.1.1"
petgraph = "0.6.5"
calamine = "0.25.0"
zip = "0.6.3"
quick-xml = "0.31.0"
futures = "0.3"
pdf-extract = "0.7.4"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-shell = "2"
bincode = "1.3.3"
bincode2 = { package = "bincode", version = "2.0.0-rc.3", features = ["serde"] }
shared_models = { path = "shared_models" }
app_domain = { path = "crates/app_domain" }
module_gis = { path = "crates/module_gis" }
module_storage = { path = "crates/module_storage" }
uuid = { version = "1.22.0", features = ["v4", "v5"] }
sha2 = "0.10.8"
rstar = "0.12.0"
parking_lot = "0.12"
geo = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
url = "2.5"
oauth2 = "4.4"
tiny_http = "0.12"
urlencoding = "2.1"
webbrowser = "0.8"
dotenvy = "0.15"
moka = { version = "0.12", features = ["sync"] }
dashmap = { version = "6.1", features = ["serde"] }
arc-swap = "1.7"
mime_guess = "2.0"
regex = "1.11"
rand = "0.8"
# Optional dependencies (guarded by features)
burn = { version = "0.16", features = ["wgpu", "train"], optional = true }
hf-hub = { version = "0.3", optional = true }
dirs = "5.0"
indicatif = "0.17"
ort = { version = "2.0.0-rc.12", features = ["ndarray"], optional = true }
# Consolidated AI acceleration features
# ort-cuda and ort-dml are removed in favor of conditional features on the main 'ort' crate if supported, 
# or handled via workspace inheritance. But here they were just redeclaring the same crate.
ndarray = { version = "0.17", optional = true }
image = "0.24"
rayon = "1.8"
lancedb = { version = "0.10", optional = true }
arrow = { version = "52", optional = true }
tokenizers = { version = "0.19", optional = true }
chrono = "=0.4.39"
firebase-rs = { version = "2.1", optional = true }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12.1"
sha-1 = "0.10.1"
base64 = "0.22.1"

[features]
default = ["analytics"]
analytics = ["dep:duckdb"]
ai = ["dep:burn", "dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub", "dep:firebase-rs"]
ai-cuda = ["ai", "ort/cuda"]
ai-dml = ["ai", "ort/directml"]
vector-db = ["dep:lancedb", "dep:arrow"]
full-ai = ["ai", "vector-db", "analytics"]


[dev-dependencies]
tempfile = "3.26.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
incremental = false
debug = false

# Individual package overrides
[profile.release.package.design_renderer]
opt-level = "s"
[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
