[package]
name = "design_renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wgpu = { version = "22.1", features = ["webgl"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
log = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
winit = "0.29.15"
wasm-bindgen-futures = "0.4"
app_domain = { path = "../crates/app_domain" }
bincode = "1.3.3"
bytemuck = { version = "1.16", features = ["derive"] }
rstar = "0.12.0"
geo = "0.29"
cgmath = "0.18"

[dependencies.web-sys]
version = "0.3.76"
features = [
  "Document",
  "Window",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
]

# Profile moved to workspace root

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
