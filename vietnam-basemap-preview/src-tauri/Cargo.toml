[package]
name = "vietnam-basemap-preview"
version = "0.1.0"
description = "Standalone Vietnam Basemap developer preview"
authors = ["Vietnam Basemap Platform"]
edition = "2021"
default-run = "vietnam-basemap-preview"

[[bin]]
name = "vietnam-basemap-preview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2.7.0"
