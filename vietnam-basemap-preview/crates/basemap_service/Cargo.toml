[package]
name = "basemap_service"
version = "0.1.0"
edition = "2021"
description = "Online service contract for the Vietnam Basemap Platform"
license = "MIT"

[dependencies]
axum = "0.8"
basemap_contract = { path = "../basemap_contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = "0.5"
