[package]
name = "financial_system"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP & Async
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "decimal", "chrono", "uuid", "json"] }
rust_decimal = { version = "1", features = ["serde-float"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AI & Performance
ort = { version = "2.0.0-rc.9" } # ONNX Runtime
dashmap = "6"
ndarray = "0.15"

# File Parsing
docx-rs = "0.4"
calamine = "0.24"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
dotenvy = "0.15"
